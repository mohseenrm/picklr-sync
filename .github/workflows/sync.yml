name: Sync Picklr to Calendar

on:
  schedule:
    # GitHub cron is UTC and does NOT observe DST. These are pinned to PDT
    # (UTC-7), so they drift an hour later during PST (winter).
    #
    # Times are set ~35 min BEFORE the target because GitHub heavily queues
    # scheduled runs on public repos. Odd minutes avoid the contested
    # :00/:15/:30 slots, which were seeing multi-hour delays.
    - cron: "23 12 * * *" # 05:23 PDT -> ~06:00 PT morning
    - cron: "23 18 * * *" # 11:23 PDT -> ~12:00 PT midday
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (crawl + plan only, no calendar writes / email)"
        type: boolean
        default: false

concurrency:
  group: picklr-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # No `version:` here — pnpm/action-setup reads packageManager from
      # package.json (pnpm@10.28.0). Specifying both errors out.
      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Cache the Playwright browser download keyed on the installed version.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(pnpm ls playwright --depth=0 --parseable --long 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        uses: actions/cache@v5
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run sync
        env:
          PICKLR_EMAIL: ${{ secrets.PICKLR_EMAIL }}
          PICKLR_PASSWORD: ${{ secrets.PICKLR_PASSWORD }}
          PICKLR_BASE_URL: ${{ vars.PICKLR_BASE_URL }}
          PICKLR_VENUE_ADDRESS: ${{ vars.PICKLR_VENUE_ADDRESS }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ vars.FROM_EMAIL }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          TIMEZONE: ${{ vars.TIMEZONE }}
          DAYS_AHEAD: ${{ vars.DAYS_AHEAD }}
          NOTIFY_ON_NO_CHANGES: ${{ vars.NOTIFY_ON_NO_CHANGES }}
          # Empty on scheduled runs → falsey → real sync.
          DRY_RUN: ${{ inputs.dry_run }}
        run: pnpm sync

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: debug
          path: |
            debug-*.png
            debug-*.html
          if-no-files-found: ignore
          retention-days: 5
