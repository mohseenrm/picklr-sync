name: Sync Picklr to Calendar

on:
  schedule:
    # GitHub cron is UTC and does NOT observe DST. To hold ~6:15 AM Pacific
    # year-round we schedule both offsets; only one is "correct" per season and
    # the other fires an hour off. The sync is idempotent, so an extra run is
    # harmless (0 changes → no email when NOTIFY_ON_NO_CHANGES=false).
    - cron: "15 13 * * *" # 06:15 PDT (UTC-7), summer
    - cron: "15 14 * * *" # 06:15 PST (UTC-8), winter
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (crawl + plan only, no calendar writes / email)"
        type: boolean
        default: false

concurrency:
  group: picklr-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # No `version:` here — pnpm/action-setup reads packageManager from
      # package.json (pnpm@10.28.0). Specifying both errors out.
      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Cache the Playwright browser download keyed on the installed version.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(pnpm ls playwright --depth=0 --parseable --long 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        uses: actions/cache@v5
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run sync
        env:
          PICKLR_EMAIL: ${{ secrets.PICKLR_EMAIL }}
          PICKLR_PASSWORD: ${{ secrets.PICKLR_PASSWORD }}
          PICKLR_BASE_URL: ${{ vars.PICKLR_BASE_URL }}
          PICKLR_VENUE_ADDRESS: ${{ vars.PICKLR_VENUE_ADDRESS }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ vars.FROM_EMAIL }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          TIMEZONE: ${{ vars.TIMEZONE }}
          DAYS_AHEAD: ${{ vars.DAYS_AHEAD }}
          NOTIFY_ON_NO_CHANGES: ${{ vars.NOTIFY_ON_NO_CHANGES }}
          # Empty on scheduled runs → falsey → real sync.
          DRY_RUN: ${{ inputs.dry_run }}
        run: pnpm sync

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: debug
          path: |
            debug-*.png
            debug-*.html
          if-no-files-found: ignore
          retention-days: 5

  keepalive:
    needs: sync
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Check commit age
        id: age
        run: |
          last=$(git log -1 --format=%ct)
          age_days=$(( ( $(date -u +%s) - last ) / 86400 ))
          echo "Last commit ${age_days}d ago"
          if [ "$age_days" -ge 30 ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push heartbeat
        if: steps.age.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOT: github-actions[bot]
        run: |
          bot_id=$(gh api "users/$BOT" --jq .id)
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive
          git config user.name "$BOT"
          git config user.email "${bot_id}+${BOT}@users.noreply.github.com"
          git add .github/keepalive
          git commit -m "chore(ci): keepalive heartbeat [skip ci]"
          git push
